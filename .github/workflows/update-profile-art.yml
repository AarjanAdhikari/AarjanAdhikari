name: Update Profile Art

on:
  push:
    paths:
      - 'source-photo.jpg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless pillow numpy
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Generate ASCII Art
        run: |
          python scripts/prep_photo.py
          python scripts/make_ascii_svg.py

      - name: Commit and Push Generated ASCII SVG
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add source-prepped.png aarjan-ascii.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate ASCII face from source-photo.jpg" && git push)
